[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-skill"
version = "2.1.0rc1"
description = "Advisory MILP tools and agent skill for Fantasy Premier League. Account writes fail closed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "click>=8.0.0",
  "pulp>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
]

[project.scripts]
fpl = "fpl_skill.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["fpl_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
