name: Phase 1 Manifest Generator

on:
  push:
    branches:
      - phase1/canonical-v2.1.0-rc1

permissions:
  contents: write

jobs:
  manifest:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Generate MANIFEST.v2.json
        env:
          RC_UPDATED_AT: "2026-09-12T18:00:00+00:00"
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          canonical_files = [
              'CHANGELOG.md',
              'SKILL.md',
              'all.python',
              'contracts/research-contract.md',
              'evidence/v2-adversarial-audit-2026-09-09.json',
              'fpl_skill/observation/__init__.py',
              'fpl_skill/observation/alerts.py',
              'fpl_skill/observation/cli.py',
              'fpl_skill/observation/diff.py',
              'fpl_skill/observation/ingest.py',
              'fpl_skill/observation/model.py',
              'fpl_skill/observation/poller.py',
              'fpl_skill/observation/snapshot.py',
              'fpl_skill/observation/store.py',
              'fpl_skill/observation/tape.py',
              'fpl_skill/observation/watcher.py',
              'fpl_skill/probabilistic_ep1.py',
              'fpl_skill/rank_aware_objective1.py',
              'fpl_skill/historical/__init__.py',
              'fpl_skill/historical/exceptions.py',
              'fpl_skill/historical/firewall.py',
              'fpl_skill/historical/provenance.py',
              'fpl_skill/historical/replay.py',
              'fpl_skill/historical/snapshot.py',
              'tests/test_observation.py',
              'tests/test_probabilistic_ep1_p023.py',
              'tests/test_rank_aware_objective1.py',
              'tests/test_replay_gate.py',
              'tests/test_historical_data_layer.py',
              'tests/test_redteam_historical_firewall.py',
              'tests/test_expected_points_semantics.py',
          ]

          hashes = {}
          for rel in canonical_files:
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'Missing canonical file: {rel}')
              hashes[rel] = hashlib.sha256(path.read_bytes()).hexdigest()

          serialized = ''.join(f'{path}:{hashes[path]}\n' for path in sorted(hashes))
          release_hash = hashlib.sha256(serialized.encode('utf-8')).hexdigest()

          manifest = {
              'skill': 'FPL skill',
              'version': '2.1.0-rc1',
              'season': '2026/27',
              'status': 'RELEASE_CANDIDATE',
              'parent': {
                  'skill': 'FPL skill',
                  'version': '2.0.0',
                  'status': 'FROZEN',
                  'commit': 'ac2e1b995f3cc6bf1eff7d017ffeddc8d6d2933c',
                  'sha256': 'da2d9b04cb30c5bc12b03d5883b7a798106b3ec20c19959218dab52e4e010d80',
              },
              'scope': 'Phase 1: canonical v2 skill contract, expected-point semantics, and release-manifest integrity',
              'canonical_files': sorted(hashes),
              'file_hashes': {path: hashes[path] for path in sorted(hashes)},
              'release_hash': release_hash,
              'release_hash_algorithm': 'SHA256 over sorted path:sha256\\n records',
              'freeze_updated': __import__('os').environ['RC_UPDATED_AT'],
          }

          Path('MANIFEST.v2.json').write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'version': manifest['version'],
              'files_hashed': len(hashes),
              'release_hash': release_hash,
          }, indent=2))
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.v2.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize v2.1.0-rc1 manifest [skip ci]"
          git push
