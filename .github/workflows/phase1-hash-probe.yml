name: Phase 1 Hash Probe

on:
  push:
    branches:
      - phase1/canonical-v2.1.0-rc1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute canonical hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path('MANIFEST.v2.json').read_text(encoding='utf-8'))
          hashes = {}
          for rel in manifest['canonical_files']:
              hashes[rel] = hashlib.sha256((Path('.') / rel).read_bytes()).hexdigest()
          for rel in ('fpl_skill/observation/watcher.py', 'fpl_skill/probabilistic_ep1.py', 'SKILL.md'):
              print(f'{rel}: {hashes[rel]}')
          payload = ''.join(f'{p}:{hashes[p]}\n' for p in sorted(hashes))
          print('RELEASE_HASH:', hashlib.sha256(payload.encode('utf-8')).hexdigest())
          print('FILES:', len(hashes))
          PY
