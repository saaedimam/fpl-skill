name: Reconciliation Branch CI

on:
  push:
    branches: [fix/gw11-live-state-reconciliation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Revision 3 checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONUNBUFFERED: "1"
      FPL_LIVE_TEST: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.5; python_version<'3.12'" "numpy==2.5.3; python_version>='3.12'"
          python -m pip install "click==8.3.3" "pulp==3.3.2" "requests==2.34.2" "highspy==1.15.1" "jsonschema==4.26.0" "pytest==9.1.1" "pytest-cov==7.1.0"
          python -m pip install -e . --no-deps
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
      - name: Compile check
        run: python -m compileall -q fpl_skill tests
      - name: Release manifest verification
        run: |
          python tests/compute_release_hash.py
          python - <<'PY'
          import json
          m=json.load(open("MANIFEST.v2.json")); r=json.load(open("tests/release_hash.json"))
          assert m["parent"]["commit"]=="ac2e1b995f3cc6bf1eff7d017ffeddc8d6d2933c"
          assert m["parent"]["sha256"]=="da2d9b04cb30c5bc12b03d5883b7a798106b3ec20c19959218dab52e4e010d80"
          assert m["parent"]["status"]=="FROZEN"
          assert m["release_hash"]==r["release_hash"] and r["reproducible"] is True
          PY
      - name: Prove network namespace has no external egress
        run: |
          # Use passwordless sudo + root network namespace; hosted runners reject
          # unprivileged user namespaces (uid_map Operation not permitted).
          PYTHON_BIN="$(command -v python)"
          sudo unshare --net -- env \
            PATH="$PATH" \\
            LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \\
            PYTHON_BIN="$PYTHON_BIN" \\
            bash -c 'ip link set lo up && "$PYTHON_BIN" tests/prove_netns_egress_denied.py'
      - name: Run full pytest suite in network namespace
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo unshare --net -- env \
            PATH="$PATH" \\
            LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \\
            PYTHON_BIN="$PYTHON_BIN" \\
            FPL_TEST_NETNS=1 \\
            bash -c 'ip link set lo up && "$PYTHON_BIN" -m pytest tests/ -ra'
